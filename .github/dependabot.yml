version: 2
updates:
  # Runtime + dev npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Collapse routine dev-dependency bumps into a single PR to cut review noise
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors of these packages need deliberate handling rather than an auto-PR:
      #  - eslint / typescript: major upgrades require a config + lockfile migration.
      #  - commander: v15+ requires Node >=22.12.0, but this project targets Node 20.
      # Minor/patch and security updates still flow normally.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]

  # GitHub Actions referenced by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
