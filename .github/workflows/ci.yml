name: CI Check

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - "**"

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs for the same ref (branch or PR) to save runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Coverage (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report results for every supported Node version instead of stopping at
      # the first failure.
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Check Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Security Audit (non-blocking)
        # Reports known advisories without failing the build. Currently surfaces
        # transitive-only findings (hono via @modelcontextprotocol/sdk; esbuild via
        # vitest/tsx). Flip to a hard gate (remove continue-on-error) once the
        # dependency tree is clean.
        continue-on-error: true
        run: npm audit --audit-level=high
