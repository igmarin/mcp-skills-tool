name: CI Check

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  validate:
    name: Lint, Test, and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Check Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Security Audit (non-blocking)
        # Reports known advisories without failing the build. Currently surfaces
        # transitive-only findings (hono via @modelcontextprotocol/sdk; esbuild via
        # vitest/tsx). Flip to a hard gate (remove continue-on-error) once the
        # dependency tree is clean.
        continue-on-error: true
        run: npm audit --audit-level=high
