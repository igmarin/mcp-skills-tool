name: Publish Docker image

# Build and publish the container image to GitHub Container Registry (GHCR).
# Fires on the same version tags as the npm release (release.yml uses
# `push: tags: ['v*']`) so the image and the npm package ship together, plus
# `workflow_dispatch` for manual/off-cycle builds.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: read the repo to build, and packages: write to push to GHCR.
permissions:
  contents: read
  packages: write

# Never run two publishes for the same ref concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push multi-arch image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # QEMU provides the emulation needed to build the linux/arm64 image on the
      # amd64 GitHub-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/igmarin/mcp-skills-tool
          # Derive tags from the pushed semver tag. The default `latest=auto`
          # flavor also tags `latest` for the highest non-prerelease version.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
