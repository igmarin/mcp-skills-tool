name: Publish Dry Run

# Preview exactly what `npm publish` would upload, so packaging regressions
# (a missing build artifact, or a stray source/test file leaking into the
# tarball) surface on every PR without ever publishing.
on:
  pull_request:
    branches:
      - "**"
  push:
    branches-ignore:
      - main

# Least privilege: only reads the repository. This workflow never publishes.
permissions:
  contents: read

# Cancel superseded runs for the same ref (branch or PR) to save runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: npm publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preview package contents (no publish)
        # --dry-run performs every step of publish except the upload and prints
        # the tarball file list. It must list only dist/**, CHANGELOG.md, and
        # package.json — never src/ or *.test.* files.
        run: npm publish --dry-run --access public
