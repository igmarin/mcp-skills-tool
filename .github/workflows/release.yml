name: Release

# Publish to npm when a version tag is pushed (e.g. v1.0.0). The full quality
# gate runs first, then `npm publish` uploads the package with provenance.
on:
  push:
    tags:
      - "v*"

# Least privilege: read the repo, and id-token: write so npm can mint a
# provenance attestation (OIDC) for the published tarball.
permissions:
  contents: read
  id-token: write

# Never run two publishes for the same tag concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        # Fail fast if the pushed tag (vX.Y.Z) does not match the version in
        # package.json, so we never publish a mislabeled release.
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "Tag version:     $tag_version"
          echo "package.json:    $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Run Linter
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
